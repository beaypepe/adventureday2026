<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d65b33">
  <link rel="icon" type="image/png" href="/adventureday2026/assets/img/favicon.png?v=20261110190459">
  <link rel="apple-touch-icon" href="/adventureday2026/assets/img/apple-touch-icon.png?v=20261110190459">
  <title>Arcade — Adventure Day 2026</title>
  <meta name="description" content="Minijuego del Adventure Day 2026: atrapa los logos y esquiva las bombas.">
  <!-- Marca de tiempo (?v=) en CSS, JS e imágenes: obliga al móvil a descargar la
       versión nueva en lugar de usar la que tiene en caché. Se actualiza con
       tools/bump-versions.sh antes de publicar cambios en assets/. -->
  <link rel="stylesheet" href="/adventureday2026/assets/css/styles.css?v=20261110190459">
</head>
<body>

  <!-- Header (común a todas las páginas). Si logo.png no carga, se oculta y aparece el texto. -->
  <header class="site-header">
    <a class="site-header__link" href="/adventureday2026/">
      <img class="site-header__logo" src="/adventureday2026/assets/img/logo.png?v=20261110190459" alt="Adventure Day 2026"
           onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
      <span class="site-header__title" hidden>Adventure Day 2026</span>
    </a>
  </header>

  <main class="site-main game">
    <h1>Arcade</h1>
    <p id="instrucciones">Mueve la cesta con el dedo para recoger los logos. Si atrapas una bomba, pierdes y hay que empezar de nuevo.</p>

    <div class="arcade-caja">
      <canvas class="arcade" id="arcade" aria-describedby="instrucciones">Activa JavaScript para jugar al arcade.</canvas>
      <!-- Botón de reintentar dentro del propio juego: al perder aparece aquí,
           sin tener que bajar hasta el de abajo. -->
      <button class="btn arcade__reintentar" id="reintentar" type="button" hidden>Reintentar</button>
    </div>

    <p class="game__estado" id="estado" role="status">Logos: 0 de 26</p>

    <button class="btn btn--secundario" id="reiniciar" type="button">Empezar de nuevo</button>

    <p class="game__respuesta" id="respuesta-final" role="status" hidden>Respuesta de esta etapa:<strong data-respuesta></strong></p>
  </main>

  <!-- Footer (común a todas las páginas) -->
  <footer class="site-footer">
    Una ocurrencia de <a href="https://beaypepe.com" target="_blank" rel="noopener">BeayPepe</a>
  </footer>

  <!-- Dibujos del arcade: se cargan aquí (ocultos) para que el navegador los tenga
       listos y para que tools/bump-versions.sh les actualice el ?v=. Si alguno no
       existe todavía, el canvas dibuja una figura equivalente. -->
  <div hidden>
    <img id="img-bueno" src="/adventureday2026/assets/img/arcade/item-good.png?v=20261110190459" alt="">
    <img id="img-malo" src="/adventureday2026/assets/img/arcade/item-bad.png?v=20261110190459" alt="">
    <img id="img-cesta" src="/adventureday2026/assets/img/arcade/player.png?v=20261110190459" alt="">
  </div>

  <script src="/adventureday2026/assets/js/common.js?v=20261110190459"></script>
  <script src="/adventureday2026/assets/js/arcade.js?v=20261110190459"></script>

</body>
</html>
