<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Probar los cinco juegos</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #ffffff;
    color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  .qr-lista {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin: 0 auto;
    padding: 0;
    max-width: 1100px;
    list-style: none;
  }
  .qr {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: min(100%, 300px);
    padding: 10px;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
  }
  .qr__imagen { display: block; width: 100%; height: auto; }
  .qr__nombre { font-size: 1rem; font-weight: 600; }
  .qr__url { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.75rem; color: #5b5b5b; }
</style>
</head>
<body>
  <ul class="qr-lista">
      <li class="qr">
        <img class="qr__imagen" src="/adventureday2026/probar/qr/laberinto.svg?v=20261110165250" alt="Código QR de Laberinto" width="600" height="600">
        <span class="qr__nombre">Laberinto</span>
        <span class="qr__url">/b4x8rf/</span>
      </li>
      <li class="qr">
        <img class="qr__imagen" src="/adventureday2026/probar/qr/puzzle.svg?v=20261110165250" alt="Código QR de Puzzle" width="600" height="600">
        <span class="qr__nombre">Puzzle</span>
        <span class="qr__url">/7k2m9p/</span>
      </li>
      <li class="qr">
        <img class="qr__imagen" src="/adventureday2026/probar/qr/parejas.svg?v=20261110165250" alt="Código QR de Parejas" width="600" height="600">
        <span class="qr__nombre">Parejas</span>
        <span class="qr__url">/3n9w2q/</span>
      </li>
      <li class="qr">
        <img class="qr__imagen" src="/adventureday2026/probar/qr/sopa.svg?v=20261110165250" alt="Código QR de Sopa de letras" width="600" height="600">
        <span class="qr__nombre">Sopa de letras</span>
        <span class="qr__url">/m8d6fc/</span>
      </li>
      <li class="qr">
        <img class="qr__imagen" src="/adventureday2026/probar/qr/arcade.svg?v=20261110165250" alt="Código QR de Arcade" width="600" height="600">
        <span class="qr__nombre">Arcade</span>
        <span class="qr__url">/5h1j7v/</span>
      </li>
  </ul>
</body>
</html>
